name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Must match desktop-v<tauri version>.
        required: true
        default: desktop-v0.1.0
        type: string
      publish:
        description: Publish the built installers as a GitHub Release.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24.14.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            runtime_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            bundle: dmg
            artifact: desktop-macos-arm64
          - name: macOS x64
            runner: macos-15-intel
            runtime_target: darwin-x64
            rust_target: x86_64-apple-darwin
            bundle: app
            artifact: desktop-macos-x64
          - name: Windows x64
            runner: windows-2025
            runtime_target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: desktop-windows-x64

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Harness
        run: pnpm run build

      - name: Prepare desktop runtime
        run: pnpm run desktop:prepare-runtime -- ${{ matrix.runtime_target }}

      - name: Build desktop installer
        if: runner.os != 'Windows'
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst R: $env:GITHUB_WORKSPACE
          try {
            Set-Location 'R:\apps\desktop'
            node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle }}
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            subst R: /d
          }

      - name: Package macOS x64 installer
        if: matrix.runtime_target == 'darwin-x64'
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkgbuild \
            --component "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/DeepSeek Harness Desktop.app" \
            --install-location /Applications \
            "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/DeepSeek Harness Desktop_${version}_x64.pkg"

      - name: Verify macOS installer
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.runtime_target }}" = "darwin-x64" ]; then
            test -n "$(find apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -name '*.pkg' -type f -print -quit)"
          else
            test -n "$(find apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          fi

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw 'Tauri produced no Windows installer.'
          }

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.pkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          expected="desktop-v${version}"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "release tag must be $expected, received $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Record installer checksums
        working-directory: dist/desktop
        run: sha256sum * > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "DeepSeek Harness Desktop $RELEASE_VERSION" \
              --notes "Unsigned preview installers for macOS arm64, macOS x64, and Windows x64. Verify SHA256SUMS before installation."
          fi
          gh release upload "$RELEASE_TAG" dist/desktop/* --clobber
